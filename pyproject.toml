[project]
name = "psp-minimal-knowledge-graph"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cognite-sdk>=8.18.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 88
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "C4"]
ignore = ["E501"]  # line length is the formatter's job
